[general]
import = ["~/.config/alacritty/themes/themes/ayu_dark.toml"]

[font]
size = 16
normal = { family = "MesloLGM Nerd Font", style = "Regular" }

[cursor.style]
blinking = "Never"

[terminal.shell]
program = "zellij"

[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r" }]
